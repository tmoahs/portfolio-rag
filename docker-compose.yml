# ---------------------------------------------------------------------------
# Base commune (sûre pour la production) : aucun port publié sauf le proxy.
#   Développement : docker compose up -d            (fusionne docker-compose.override.yml)
#   Production    : docker compose --env-file .env.prod \
#                     -f docker-compose.yml -f docker-compose.prod.yml up -d
# ---------------------------------------------------------------------------
name: portfolio-rag

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: portfolio-rag-airflow:3.3.2
  restart: unless-stopped
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-portfolio_db}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-portfolio_db}
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?FERNET_KEY manquante}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?JWT secret manquant}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    # Le conteneur ne doit pas installer de dépendances à chaque démarrage.
    _PIP_ADDITIONAL_REQUIREMENTS: ""
    GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY manquante}
    DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-portfolio_db}
    # Connexion Airflow utilisée par les SQLExecuteQueryOperator du DAG analytics.
    AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-portfolio_db}
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    PYTHONPATH: /opt/airflow
    RETENTION_DAYS: ${RETENTION_DAYS:-365}
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./config:/opt/airflow/config:ro
    - ./plugins:/opt/airflow/plugins
    - ./knowledge:/opt/airflow/knowledge:ro
  networks:
    - data
    - edge
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  mem_limit: 1g

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    mem_limit: 512m

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: portfolio-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      # Chroma 1.x écrit dans /data : c'est CE chemin qu'il faut persister.
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    mem_limit: 512m

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-rag-api:${IMAGE_TAG:-1.0.0}
    container_name: portfolio-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-portfolio_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY manquante}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8000}
      RATE_LIMIT_ASK: ${RATE_LIMIT_ASK:-10/minute}
      RATE_LIMIT_FEEDBACK: ${RATE_LIMIT_FEEDBACK:-20/minute}
      DAILY_QUESTION_LIMIT: ${DAILY_QUESTION_LIMIT:-200}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
      CACHE_ENABLED: ${CACHE_ENABLED:-1}
      CACHE_SEMANTIC: ${CACHE_SEMANTIC:-1}
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.97}
      CACHE_TTL_DAYS: ${CACHE_TTL_DAYS:-7}
      # Derrière le proxy, l'IP réelle arrive dans X-Forwarded-For (voir limiter.py).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: false
    logging: *default-logging
    mem_limit: 640m

  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: portfolio-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --firstname Airflow --lastname Admin \
          --role Admin \
          --email "${_AIRFLOW_WWW_USER_EMAIL:-admin@example.com}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:?mot de passe admin Airflow requis}" || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_EMAIL: ${_AIRFLOW_WWW_USER_EMAIL:-admin@example.com}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?mot de passe admin Airflow requis}
    # Même utilisateur que les autres services : le paquet airflow est installé
    # dans le site-packages de l'utilisateur airflow (pas dans celui de root).
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: portfolio-airflow-apiserver
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: portfolio-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    profiles: ["airflow"]
    container_name: portfolio-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  chroma_data:
  airflow_logs:

networks:
  # edge : accès Internet sortant (Gemini) + proxy.
  edge:
    driver: bridge
  # data : base et vecteurs, sans accès Internet.
  data:
    driver: bridge
    internal: true
